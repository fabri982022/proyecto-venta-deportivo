services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: deporte
    ports:
      - "3307:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ppassword || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 120s
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ./back
    container_name: spring-backend
    ports:
      - "8080:8080"
    networks:
      - app-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/deporte
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./front
    container_name: react-frontend
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      - REACT_APP_API_URL=http://backend:8080
    depends_on:
      - backend
      - db
    stdin_open: true

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data: