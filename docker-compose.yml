version: "3.9"

services:
  backend:
    build:
      context: ./back
    container_name: spring-backend
    ports:
      - "8080:8080"
    networks:
      - app-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  frontend:
    build:
      context: ./front
    container_name: react-frontend
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      - REACT_APP_API_URL=http://backend:8080
    depends_on:
      - backend
    stdin_open: true

networks:
  app-network:
    driver: bridge