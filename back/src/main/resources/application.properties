spring.application.name=deporte
server.port=8080

# create and drop tables and sequences, loads import.sql
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=update

#  mySql settings
spring.datasource.url=jdbc:mysql://localhost:3306/deporte?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cambiado de MySQL8Dialect a MySQLDialect para Hibernate 6.x
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cargar el archivo import.sql al iniciar
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Configuración para Docker
spring.config.import=optional:file:.env[.properties]