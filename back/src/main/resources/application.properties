spring.application.name=deporte
server.port=8080

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update

# MySQL settings - Detecta automáticamente si está en Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/deporte?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration (SIN auto-commit)
spring.datasource.hikari.connection-timeout=90000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging
logging.level.root=INFO
logging.level.com.peoyecto=DEBUG
logging.level.org.springframework.web=DEBUG

# Server configuration
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10

# Cargar el archivo import.sql al iniciar
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Configuración para Docker
spring.config.import=optional:file:.env[.properties]