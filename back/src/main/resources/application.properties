spring.application.name=deporte
server.port=8080

# create and drop tables and sequences, loads import.sql
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=update

#  mySql settings
spring.datasource.url=jdbc:mysql://localhost:3306/tp8?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
#password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.show-sql=false
#logging.level.ar.edu.unju.fi.poo.tp8poo.service=DEBUG
spring.jpa.properties.hibernate.format_sql=true

# Cargar el archivo import.sql al iniciar
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Configuración para Docker
spring.config.import=optional:file:.env[.properties]